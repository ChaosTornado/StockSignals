              - list [ref=f1e725]:
                - listitem [ref=f1e726]:
                  - text: 核心数据来源：
                  - list [ref=f1e727]:
                    - listitem [ref=f1e728]:
                      - text: 社融数据：优先合并 AkShare/商务部历史序列，并从中国人民银行官网
                      - link "《社会融资规模增量统计表》" [ref=f1e729] [cursor=pointer]:
                        - /url: https://www.pbc.gov.cn/diaochatongjisi/116219/116319/index.html
                      - text: 覆盖已发布月份。
                    - listitem [ref=f1e730]:
                      - text: GDP 数据：AkShare 提供历史季度序列；国家统计局
                      - link "《国内生产总值初步核算结果》" [ref=f1e731] [cursor=pointer]:
                        - /url: https://data.stats.gov.cn/dg/website/page.html#/pc/national/quarterData
                      - text: 表中的单季现价 GDP 绝对额用于覆盖近期季度。
                - listitem [ref=f1e732]:
                  - text: 数据更新：
                  - list [ref=f1e733]:
                    - listitem [ref=f1e734]: 社融：每月 10-15 日发布上月数据
                    - listitem [ref=f1e735]: GDP：一般于季后 15 日左右发布上季度初步核算数据；月末计算时不使用尚未发布季度。
          - heading "二、信用脉冲的详细计算步骤" [level=2] [ref=f1e736]
          - paragraph [ref=f1e737]: 根据视频和公开资料，信用脉冲的计算分为 4 步：
          - list [ref=f1e738]:
            - listitem [ref=f1e739]:
              - strong [ref=f1e740]: 计算最近 6 个月社融增量之和
              - text: ：
              - paragraph [ref=f1e741]: 例如，2026 年 10 月的信用脉冲，需要计算 2026 年 5 月 - 10 月的社融增量总和。
            - listitem [ref=f1e742]:
              - strong [ref=f1e743]: 计算去年同期 6 个月社融增量之和
              - text: ：
              - paragraph [ref=f1e744]: 即 2025 年 5 月 - 10 月的社融增量总和。
            - listitem [ref=f1e745]:
              - strong [ref=f1e746]: 计算差值
              - text: ：
              - paragraph [ref=f1e747]: 差值 = 最近 6 个月社融增量之和 - 去年同期 6 个月社融增量之和
            - listitem [ref=f1e748]:
              - strong [ref=f1e749]: 计算信用脉冲
              - text: ：
              - paragraph [ref=f1e750]: 信用脉冲 = 差值 ÷ 截至计算月份月末已发布的最近两个季度名义 GDP 之和 × 100
